<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#202936">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard">
    <meta name="description" content="Panel de ventas en tiempo real — Antiparticula POS">
    <meta name="robots" content="noindex">

    <title>Dashboard — Antiparticula POS</title>

    <link rel="manifest" href="/dashboard/manifest.json">
    <link rel="icon" href="/dashboard/icon-192.png">
    <link rel="apple-touch-icon" href="/dashboard/icon-192.png">
    <link rel="stylesheet" href="/dashboard/dashboard.css?v=11">

    <!-- Tema fijado por el usuario: se aplica antes de pintar para que no parpadee -->
    <script>
        try {
            var t = localStorage.getItem('apdash:tema');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* sin almacenamiento: se sigue al sistema */ }
    </script>
</head>
<body>
    <div id="app">
        <!-- Contenido renderizado por dashboard.js -->
        <header class="top"><div class="top-in">
            <div class="bar"><div class="brand"><img src="/dashboard/icon-192.png" alt="" width="32" height="32"><span>Antipartícula</span></div></div>
            <div class="skel skel-hero"></div>
        </div></header>
    </div>

    <noscript>
        <div style="padding:24px;color:#e2e8f0;font-family:Helvetica,Arial,sans-serif">
            <strong>Este panel necesita JavaScript activado.</strong>
            <p style="color:#7ab8d9">Actívalo en tu navegador para ver las ventas.</p>
        </div>
    </noscript>

    <script>
        // CRITICO-02 fix: escapar datos antes de insertar en innerHTML
        function escHtmlInline(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;');
        }
        window.onerror = function(msg, src, line) {
            document.getElementById('app').innerHTML =
                '<div style="padding:20px;color:#f87171;font-family:monospace;font-size:13px;background:#1a1a1a;min-height:100vh">' +
                '<b>ERROR JS:</b><br>' + escHtmlInline(msg) + '<br><br>' +
                '<b>Archivo:</b> ' + escHtmlInline(src) + '<br>' +
                '<b>Línea:</b> ' + parseInt(line, 10) + '</div>';
        };
        window.addEventListener('unhandledrejection', function(e) {
            const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
            document.getElementById('app').innerHTML =
                '<div style="padding:20px;color:#fbbf24;font-family:monospace;font-size:13px;background:#1a1a1a;min-height:100vh">' +
                '<b>PROMISE ERROR:</b><br>' + escHtmlInline(msg) + '</div>';
        });
    </script>
    <script src="/dashboard/dashboard.js?v=11" defer></script>
    <script src="/dashboard/tiendas.js?v=11" defer></script>
</body>
</html>
