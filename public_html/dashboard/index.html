<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#202936">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard">
    <meta name="description" content="Panel de ventas en tiempo real — Antiparticula POS">

    <title>Dashboard — Antiparticula POS</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../img/A.png">
    <link rel="apple-touch-icon" href="../img/A.png">
    <link rel="stylesheet" href="dashboard.css">

    <!-- Chart.js CDN — async para no bloquear el render -->
    <script async src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Contenido renderizado por dashboard.js -->
        <div class="loading-spinner">
            <div class="spinner"></div>
            <span>Cargando...</span>
        </div>
    </div>

    <script>
        // CRITICO-02 fix: escapar datos antes de insertar en innerHTML
        function escHtmlInline(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;');
        }
        window.onerror = function(msg, src, line) {
            document.getElementById('app').innerHTML =
                '<div style="padding:20px;color:#f87171;font-family:monospace;font-size:13px;background:#1a1a1a;min-height:100vh">' +
                '<b>ERROR JS:</b><br>' + escHtmlInline(msg) + '<br><br>' +
                '<b>Archivo:</b> ' + escHtmlInline(src) + '<br>' +
                '<b>Línea:</b> ' + parseInt(line, 10) + '</div>';
        };
        window.addEventListener('unhandledrejection', function(e) {
            const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
            document.getElementById('app').innerHTML =
                '<div style="padding:20px;color:#fbbf24;font-family:monospace;font-size:13px;background:#1a1a1a;min-height:100vh">' +
                '<b>PROMISE ERROR:</b><br>' + escHtmlInline(msg) + '</div>';
        });
    </script>
    <script src="dashboard.js" defer></script>
</body>
</html>
